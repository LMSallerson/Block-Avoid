<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avoid Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; color:white; font-family: Arial; }
    canvas { display: block; }
    #ui { position: fixed; top: 10px; left: 10px; z-index: 10; }
    button { margin-right: 8px; padding: 8px 12px; font-size: 14px; cursor: pointer; }

    #startScreen, #gameOverScreen {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center;
    }

    #gameOverScreen { display:none; }

    input { padding:8px; font-size:14px; margin-top:10px; }

    #leaderboard { margin-top:15px; }
  </style>
</head>
<body>

<div id="ui">
  <button onclick="togglePause()">Pause</button>
</div>

<div id="startScreen">
  <h1>Avoid Game</h1>
  <input id="playerName" placeholder="Enter name" />
  <br>
  <button onclick="startGame()">Start</button>
</div>

<div id="gameOverScreen">
  <h1>Game Over</h1>
  <p id="finalScore"></p>
  <div id="leaderboard"></div>
  <button onclick="restartGame()">Restart</button>
</div>

<canvas id="gameCanvas"></canvas>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
// 🔴 REPLACE WITH YOUR FIREBASE CONFIG
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = { x: canvas.width/2, y: canvas.height/2, size: 20, speed: 5 };

let obstacles = [];
let powerUps = [];
let keys = {};
let score = 0;
let gameOver = false;
let paused = false;
let started = false;
let playerName = "";

function startGame(){
  playerName = document.getElementById('playerName').value.trim();
  if(!playerName) return alert("Enter a name");
  document.getElementById('startScreen').style.display='none';
  started = true;
}

function spawnObstacle() {
  if (paused || gameOver || !started) return;
  const side = Math.floor(Math.random() * 3);
  let o = { size: 20 + Math.random()*20, speed: 2 + Math.random()*3 };

  if (side === 0) { o.x = Math.random()*canvas.width; o.y = -20; o.vx = 0; o.vy = o.speed; }
  else if (side === 1) { o.x = -20; o.y = Math.random()*canvas.height; o.vx = o.speed; o.vy = 0; }
  else { o.x = canvas.width+20; o.y = Math.random()*canvas.height; o.vx = -o.speed; o.vy = 0; }

  obstacles.push(o);
}

function spawnPowerUp(type) {
  if (paused || gameOver || !started) return;
  powerUps.push({
    x: Math.random()*(canvas.width-20),
    y: Math.random()*(canvas.height-20),
    size:15,
    type:type,
    spawnTime:Date.now()
  });
}

function update() {
  if (gameOver || paused || !started) return;

  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx--;
  if (keys['arrowright']||keys['d']) dx++;
  if (keys['arrowup']||keys['w']) dy--;
  if (keys['arrowdown']||keys['s']) dy++;

  if (dx||dy){ let len=Math.sqrt(dx*dx+dy*dy); dx/=len; dy/=len; }

  player.x+=dx*player.speed;
  player.y+=dy*player.speed;

  player.x=Math.max(0,Math.min(canvas.width-player.size,player.x));
  player.y=Math.max(0,Math.min(canvas.height-player.size,player.y));

  obstacles.forEach(o=>{o.x+=o.vx;o.y+=o.vy;});

  obstacles = obstacles.filter(o=>o.x>-50&&o.x<canvas.width+50&&o.y>-50&&o.y<canvas.height+50);

  obstacles.forEach(o=>{
    if(player.x<o.x+o.size&&player.x+player.size>o.x&&player.y<o.y+o.size&&player.y+player.size>o.y){
      endGame();
    }
  });

  const now=Date.now();
  powerUps=powerUps.filter(p=>now-p.spawnTime<5000);

  powerUps=powerUps.filter(p=>{
    const hit=(player.x<p.x+p.size&&player.x+player.size>p.x&&player.y<p.y+p.size&&player.y+player.size>p.y);
    if(hit){
      if(p.type==='blue') score+=200;
      if(p.type==='pink') score+=1000;
      if(p.type==='purple') score+=10000;
    }
    return !hit;
  });

  score++;
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!started) return;

  ctx.fillStyle='lime';
  ctx.fillRect(player.x,player.y,player.size,player.size);

  ctx.fillStyle='red';
  obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.size,o.size));

  powerUps.forEach(p=>{
    ctx.fillStyle = p.type==='blue'?'blue':p.type==='pink'?'pink':'purple';
    ctx.fillRect(p.x,p.y,p.size,p.size);
  });

  ctx.fillStyle='white';
  ctx.font='20px Arial';
  ctx.fillText('Score: '+score,20,30);

  if(paused) ctx.fillText('PAUSED',canvas.width/2-40,canvas.height/2);
}

function gameLoop(){ update(); draw(); requestAnimationFrame(gameLoop); }

function endGame(){
  gameOver=true;
  document.getElementById('gameOverScreen').style.display='block';
  document.getElementById('finalScore').textContent='Score: '+score;

  // save score
  db.collection("scores").add({ name: playerName, score: score });

  loadLeaderboard();
}

function loadLeaderboard(){
  db.collection("scores")
    .orderBy("score","desc")
    .limit(5)
    .get()
    .then(snapshot=>{
      let html="<h3>Leaderboard</h3>";
      snapshot.forEach(doc=>{
        let d=doc.data();
        html += `<div>${d.name}: ${d.score}</div>`;
      });
      document.getElementById('leaderboard').innerHTML=html;
    });
}

function restartGame(){
  obstacles=[]; powerUps=[]; score=0;
  player.x=canvas.width/2; player.y=canvas.height/2;
  gameOver=false; paused=false;
  document.getElementById('gameOverScreen').style.display='none';
}

function togglePause(){ if(!gameOver) paused=!paused; }

document.addEventListener('visibilitychange',()=>{ if(document.hidden) paused=true; });

setInterval(spawnObstacle,800);
setInterval(()=>spawnPowerUp('blue'),3000);
setInterval(()=>{ if(score>=10000) spawnPowerUp('pink'); },5000);
setInterval(()=>{ if(score>=100000) spawnPowerUp('purple'); },10000);

document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

gameLoop();
</script>

</body>
</html>
