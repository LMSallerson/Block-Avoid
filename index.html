<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Avoid Game</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: Arial, sans-serif; }
    canvas { display: block; }
    
    /* Changed left: 10px to right: 10px */
    #ui { 
      position: fixed; 
      top: 10px; 
      right: 10px; 
      z-index: 10; 
      text-align: right; 
    }

    button { 
      padding: 10px 20px; 
      font-size: 16px; 
      cursor: pointer; 
      background: lime; 
      border: none; 
      border-radius: 5px;
      font-weight: bold;
    }
    button:hover { background: #32cd32; }

    .overlay {
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      color: white; 
      display: flex; 
      flex-direction: column;
      justify-content: center; 
      align-items: center;
      z-index: 20;
    }

    #gameOverScreen { display: none; }
    
    .controls-hint {
      margin-top: 20px;
      color: #aaa;
      font-size: 0.9em;
    }
  </style>
</head>
<body>

<div id="ui">
  <button onclick="togglePause()">Pause</button>
</div>

<div id="startScreen" class="overlay">
  <h1>AVOID GAME</h1>
  <p>Don't touch the red squares!</p>
  <button onclick="startGame()">Start Game</button>
  <div class="controls-hint">Use WASD or Arrow Keys to move</div>
</div>

<div id="gameOverScreen" class="overlay">
  <h1>Game Over</h1>
  <h2 id="finalScore"></h2>
  <button onclick="restartGame()">Play Again</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const player = { x: canvas.width/2, y: canvas.height/2, size: 20, speed: 5 };

let obstacles = [];
let powerUps = [];
let keys = {};
let score = 0;
let gameOver = false;
let paused = false;
let gameStarted = false;

function startGame() {
  gameStarted = true;
  document.getElementById('startScreen').style.display = 'none';
}

function spawnObstacle() {
  if (!gameStarted || paused || gameOver) return;

  const side = Math.floor(Math.random() * 3);
  let o = { size: 20 + Math.random()*20, speed: 2 + Math.random()*3 };

  if (side === 0) {
    o.x = Math.random()*canvas.width; o.y = -20; o.vx = 0; o.vy = o.speed;
  } else if (side === 1) {
    o.x = -20; o.y = Math.random()*canvas.height; o.vx = o.speed; o.vy = 0;
  } else {
    o.x = canvas.width+20; o.y = Math.random()*canvas.height; o.vx = -o.speed; o.vy = 0;
  }
  obstacles.push(o);
}

function spawnPowerUp(type) {
  if (!gameStarted || paused || gameOver) return;

  powerUps.push({
    x: Math.random() * (canvas.width - 20),
    y: Math.random() * (canvas.height - 20),
    size: 15,
    type: type,
    spawnTime: Date.now()
  });
}

function update() {
  if (!gameStarted || gameOver || paused) return;

  let dx=0, dy=0;
  if (keys['arrowleft']||keys['a']) dx--;
  if (keys['arrowright']||keys['d']) dx++;
  if (keys['arrowup']||keys['w']) dy--;
  if (keys['arrowdown']||keys['s']) dy++;

  if (dx!==0||dy!==0) {
    const len = Math.sqrt(dx*dx+dy*dy);
    dx/=len; dy/=len;
  }

  player.x += dx*player.speed;
  player.y += dy*player.speed;

  player.x = Math.max(0, Math.min(canvas.width-player.size, player.x));
  player.y = Math.max(0, Math.min(canvas.height-player.size, player.y));

  obstacles.forEach(o=>{ o.x+=o.vx; o.y+=o.vy; });

  obstacles = obstacles.filter(o=>
    o.x>-50 && o.x<canvas.width+50 && o.y>-50 && o.y<canvas.height+50
  );

  obstacles.forEach(o=>{
    if (player.x < o.x+o.size && player.x+player.size > o.x &&
        player.y < o.y+o.size && player.y+player.size > o.y) {
      endGame();
    }
  });

  const now = Date.now();
  powerUps = powerUps.filter(p => now - p.spawnTime < 5000);

  powerUps = powerUps.filter(p=>{
    const hit = (
      player.x < p.x+p.size &&
      player.x+player.size > p.x &&
      player.y < p.y+p.size &&
      player.y+player.size > p.y
    );

    if (hit) {
      if (p.type === 'blue') score += 200;
      if (p.type === 'pink') score += 1000;
      if (p.type === 'purple') score += 10000;
    }

    return !hit;
  });

  score++;
}

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if (!gameStarted) return;

  ctx.fillStyle='lime';
  ctx.fillRect(player.x,player.y,player.size,player.size);

  ctx.fillStyle='red';
  obstacles.forEach(o=>ctx.fillRect(o.x,o.y,o.size,o.size));

  powerUps.forEach(p=>{
    if (p.type === 'blue') ctx.fillStyle='blue';
    if (p.type === 'pink') ctx.fillStyle='pink';
    if (p.type === 'purple') ctx.fillStyle='purple';
    ctx.fillRect(p.x,p.y,p.size,p.size);
  });

  ctx.fillStyle='white';
  ctx.font='20px Arial';
  ctx.fillText('Score: '+score,20,30);

  if (paused) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='white';
    ctx.fillText('PAUSED',canvas.width/2-40,canvas.height/2);
  }
}

function gameLoop(){ update(); draw(); requestAnimationFrame(gameLoop); }

function endGame(){
  gameOver=true;
  document.getElementById('gameOverScreen').style.display='flex';
  document.getElementById('finalScore').textContent='Score: '+score;
}

function restartGame(){
  obstacles=[]; powerUps=[]; score=0;
  player.x=canvas.width/2; player.y=canvas.height/2;
  gameOver=false; paused=false;
  document.getElementById('gameOverScreen').style.display='none';
}

function togglePause(){ 
    if(!gameOver && gameStarted) paused=!paused; 
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden && gameStarted) {
    paused = true;
  }
});

setInterval(spawnObstacle,800);
setInterval(()=>spawnPowerUp('blue'),3000);
setInterval(()=>{ if(score>=10000) spawnPowerUp('pink'); },5000);
setInterval(()=>{ if(score>=100000) spawnPowerUp('purple'); },10000);

document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

gameLoop();
</script>

</body>
</html>
